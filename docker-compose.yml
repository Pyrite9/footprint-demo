# 백엔드, 화면, PostgreSQL, MinIO를 한 번에 켭니다. 이 폴더(저장소 맨 위)에서 docker compose up -d --build.
# 개발할 때처럼 DB와 MinIO만 켜려면 infra 폴더에서 docker compose up -d를 씁니다.
# 이름이 infra와 같은 footprint-demo라서 두 방법이 같은 컨테이너와 volume을 씁니다.
name: footprint-demo

# include: infra/docker-compose.yml의 postgres, minio 서비스를 그대로 가져옵니다. 같은 설정을 두 번 쓰지 않기 위해서입니다.
include:
  - infra/docker-compose.yml

services:
  backend:
    build: ./backend
    container_name: footprint-demo-backend
    # infra/.env가 있으면 DB·MinIO 계정을 여기서 읽습니다. 없으면 application.yml의 기본값(.env.example과 같음)을 씁니다.
    env_file:
      - path: infra/.env
        required: false
    # 컨테이너끼리는 서비스 이름(postgres, minio)으로 찾아가고, 포트는 컨테이너 안쪽 포트를 씁니다.
    # environment가 env_file보다 우선이라 infra/.env의 POSTGRES_PORT(내 컴퓨터 쪽 포트)를 덮어씁니다.
    # 운영 설정으로 켜려면 infra/.env에 SPRING_PROFILES_ACTIVE=prod와 바꾼 비밀값을 넣습니다(infra/.env.example의 "운영 설정" 줄).
    # 넣지 않으면 개발 설정 그대로입니다. 운영 설정은 비밀값이 기본값이면 켜지지 않습니다(backend/README.md "운영 설정으로 켜기").
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      STORAGE_ENDPOINT: http://minio:9000
      # 컨테이너의 기본 시간대는 UTC라서 기록 시각(업로드, 평가 제출)이 9시간 이르게 저장됩니다. 한국 시간으로 맞춥니다.
      TZ: Asia/Seoul
    # 127.0.0.1(IPv4)에만 엽니다. Windows에서는 localhost가 IPv6(::1)로도 연결되는데, 그 연결을 중계하는 WSL 프로그램이
    # 20MB를 넘는 업로드 뒤에 멈춰 localhost:8080 전체가 응답하지 않는 일이 있었습니다.
    # 화면은 이 포트를 쓰지 않고 화면 컨테이너의 nginx를 거쳐 compose 안의 네트워크로 부릅니다(frontend/nginx.conf). 이 포트는 Postman과 상태 확인용입니다.
    ports:
      - "127.0.0.1:8080:8080"
    # DB와 MinIO의 healthcheck가 통과한 뒤에 켭니다. 서버가 켜지면서 테이블(Flyway migration), 시작 데이터, 버킷을 만들기 때문입니다.
    # 데이터는 postgres-data volume에 남아서, backend를 다시 켜거나 이미지를 새로 만들어도 기록이 지워지지 않습니다(O-1).
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    # 서버가 요청을 받을 수 있는지 상태 확인 주소로 봅니다(O-8). docker compose ps의 STATUS에 healthy/unhealthy로 나옵니다.
    # curl은 백엔드 이미지(eclipse-temurin:21-jre)에 들어 있습니다. -f: 503 DOWN이면 실패로 칩니다.
    # 데이터베이스가 꺼지면 응답이 30초 뒤에 오므로(연결을 기다리는 시간) timeout 5초에 걸려 실패로 칩니다.
    # start_period: 서버가 켜지고 migration을 돌리는 동안의 실패는 세지 않습니다.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      args:
        # 화면이 부르는 백엔드 주소입니다. 화면과 같은 주소의 /api이고, 화면 컨테이너의 nginx가 /api를 떼고 backend 서비스로 넘깁니다.
        # 같은 주소로 불러야 브라우저가 로그인 cookie를 보냅니다(docs/api-draft.md "공통").
        VITE_API_URL: /api
        # 이메일·비밀번호 로그인 폼을 보일지 정합니다. 운영 설정으로 켠 백엔드와 함께 쓸 때만 false로 둡니다.
        # 이 파일의 ${이름:-기본값}은 셸 환경 변수나 이 폴더의 .env에서 읽습니다. infra/.env의 값을 쓰려면 docker compose --env-file infra/.env up -d --build
        VITE_PASSWORD_LOGIN: ${VITE_PASSWORD_LOGIN:-true}
    container_name: footprint-demo-frontend
    # 개발 서버와 같은 5173으로 엽니다. 화면은 http://localhost:5173 으로 엽니다(백엔드의 CORS 허용 주소와 같아야 합니다).
    ports:
      - "127.0.0.1:5173:80"
    # 화면은 만들어 둔 파일을 내주고, /api 요청만 백엔드로 넘깁니다. 백엔드가 켜지기 전에 온 /api 요청은 502이고 화면 파일은 그대로 나가서,
    # 백엔드가 healthy가 될 때까지 기다리지 않습니다.
    depends_on:
      - backend
