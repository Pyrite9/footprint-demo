spring:
  datasource:
    # POSTGRES_HOST: 내 컴퓨터에서 실행하면 localhost, docker compose 안에서 실행하면 서비스 이름 postgres입니다.
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:footprint}
    username: ${POSTGRES_USER:footprint}
    password: ${POSTGRES_PASSWORD:change-me}
  servlet:
    multipart:
      # 산출물 파일 하나의 상한과 요청 전체의 상한입니다. 넘으면 400 INVALID_INPUT입니다(GlobalExceptionHandler).
      max-file-size: 20MB
      max-request-size: 20MB
  jackson:
    # 요청 JSON의 값을 Java 타입으로 바꿀 때 "비슷하면 바꿔 주기"를 끕니다. 바꾸지 못하면 400 INVALID_INPUT입니다.
    # 끄지 않으면 점수 4.5가 4로 잘려 저장되고, 문자열 "5"가 숫자 5로 받아들여집니다(가짜 API는 둘 다 400).
    deserialization:
      # 소수(4.5, 5.0)를 정수 필드에 넣지 않습니다.
      accept-float-as-int: false
    mapper:
      # 문자열 "5"를 숫자 필드에 넣지 않습니다.
      allow-coercion-of-scalars: false
  jpa:
    # Controller에서 XxxResponse.from(entity)로 바꿀 때 연결된 Entity(예: 조원의 회원 이름)를 그때 읽어 옵니다(LAZY).
    # 그러려면 응답을 만드는 동안 DB 연결이 열려 있어야 해서 open-in-view를 켭니다. 기본값도 true지만, 적지 않으면 시작할 때 WARN이 나옵니다.
    open-in-view: true
    hibernate:
      # 테이블은 Flyway가 src/main/resources/db/migration의 SQL 파일로 만듭니다. Hibernate는 Entity와 테이블이 맞는지 확인만 합니다.
      # 맞지 않으면(열이 없음, 타입이 다름) 서버가 켜지지 않습니다. 서버를 다시 켜도 기록은 지워지지 않습니다(O-1).
      ddl-auto: validate
    # 실행한 SQL을 로그에 찍습니다. 값 자리는 ?로 나오고 실제 값은 찍히지 않습니다. 운영 설정(application-prod.yml)에서는 끕니다.
    show-sql: true
    properties:
      hibernate:
        format_sql: true

jwt:
  # HS256 서명 키입니다. 32바이트(영문 32자) 이상이어야 합니다. 배포할 때는 환경 변수 JWT_SECRET으로 바꿉니다.
  # 운영 설정(prod)에서 이 기본값 그대로면 서버가 켜지지 않습니다(config/ProductionSettingsChecker). DB·MinIO 비밀번호도 같습니다.
  secret: ${JWT_SECRET:footprint-demo-dev-secret-key-change-me-0000}
  # token 유효 시간(분)입니다. 1440분은 24시간입니다.
  expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}

google:
  # 구글 로그인의 OAuth Client ID입니다. 비밀값이 아닙니다(화면 파일에도 들어갑니다). frontend/.env의 VITE_GOOGLE_CLIENT_ID와 같아야 합니다.
  client-id: ${GOOGLE_CLIENT_ID:729696424693-ktasf5hijpb7v53ga17j1469e8batb8f.apps.googleusercontent.com}
  # 로그인을 허용할 학교 Google Workspace 도메인(ID token의 hd)입니다. 여러 개면 쉼표로 구분합니다.
  allowed-domains: ${GOOGLE_ALLOWED_DOMAINS:g.yju.ac.kr}
  # 구글 로그인할 때 교수로 저장하거나 교수로 올릴 이메일 목록입니다. 쉼표로 구분합니다.
  # 이미 있는 학생도 다음 구글 로그인 때 교수로 올립니다(X-1). 조 참여 기록이 있는 학생은 올리지 않고, 목록에서 빼도 교수를 내리지 않습니다.
  # 실제 사람의 이메일이라 저장소에 적지 않고 infra/.env 또는 환경 변수 PROFESSOR_EMAILS로 넣습니다. 비어 있으면 모두 학생입니다.
  professor-emails: ${PROFESSOR_EMAILS:}

storage:
  # MinIO(S3 호환 저장소) 접속값입니다. 기본값은 infra/.env.example과 같습니다.
  endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ROOT_USER:footprint}
  secret-key: ${MINIO_ROOT_PASSWORD:change-me-please}
  # 산출물 파일 본문을 넣는 버킷 이름입니다. 서버가 시작할 때 없으면 만듭니다.
  bucket: ${STORAGE_BUCKET:footprint}

footprint:
  # 빈 데이터베이스에 시작 데이터(시작 계정 11명, 데모 과제)를 넣을지 정합니다. config/DataInitializer가 읽습니다.
  # 운영 설정(application-prod.yml)에서는 false입니다.
  seed-data: true
  # 이메일·비밀번호 로그인(POST /auth/login)을 받을지 정합니다. service/AuthService가 읽습니다.
  # 운영 설정(application-prod.yml)에서는 false입니다. 구글 로그인은 두 설정 모두 켜져 있습니다.
  password-login: true

cors:
  # 백엔드를 부를 수 있는 화면 주소(origin)입니다. 여러 개면 쉼표로 구분합니다. config/WebConfig가 읽습니다.
  # 주소는 http(s)://호스트:포트까지만 적고 끝에 /를 붙이지 않습니다. 브라우저가 보내는 Origin과 글자가 똑같아야 합니다.
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

management:
  # 상태 확인(O-8)입니다. GET /actuator/health 하나만 열고 {"status":"UP"} 또는 {"status":"DOWN"}만 돌려줍니다.
  # docker의 healthcheck와 운영자가 "서버가 살아 있고 데이터베이스에 닿는가"를 볼 때 씁니다. token 없이 부릅니다(SecurityConfig).
  endpoints:
    # actuator의 주소(env, beans, metrics, info 등)를 기본으로 모두 끕니다. 아래에서 health만 다시 켭니다.
    # env는 비밀값을, beans는 서버 구조를 보여 줄 수 있어서 열지 않습니다.
    access:
      default: none
    web:
      exposure:
        include: health
      # /actuator 주소의 목록 화면(열린 주소 안내)을 끕니다. 부르면 다른 없는 주소처럼 처리됩니다.
      discovery:
        enabled: false
  endpoint:
    health:
      access: read-only
      # 응답에 상세(DB 종류, 디스크 경로·남은 용량, 항목별 상태)를 넣지 않습니다. 맨 위 status만 나갑니다.
      show-details: never
      show-components: never

server:
  tomcat:
    # 20MB를 넘는 업로드도 남은 body를 읽어 버린 뒤 400 응답을 보냅니다. 기본값(2MB)이면 Tomcat이 읽기를 멈추고 연결을 끊어서,
    # 브라우저가 400 대신 "연결이 끊어짐" 오류를 볼 수 있습니다. 100MB 상한은 둬서 아주 큰 요청은 계속 끊습니다.
    max-swallow-size: 100MB
