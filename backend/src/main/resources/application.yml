spring:
  datasource:
    # POSTGRES_HOST: 내 컴퓨터에서 실행하면 localhost, docker compose 안에서 실행하면 서비스 이름 postgres입니다.
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:footprint}
    username: ${POSTGRES_USER:footprint}
    password: ${POSTGRES_PASSWORD:change-me}
  servlet:
    multipart:
      # 산출물 파일 하나의 상한과 요청 전체의 상한입니다. 넘으면 400 INVALID_INPUT입니다(GlobalExceptionHandler).
      max-file-size: 20MB
      max-request-size: 20MB
  jpa:
    # Controller에서 XxxResponse.from(entity)로 바꿀 때 연결된 Entity(예: 조원의 회원 이름)를 그때 읽어 옵니다(LAZY).
    # 그러려면 응답을 만드는 동안 DB 연결이 열려 있어야 해서 open-in-view를 켭니다. 기본값도 true지만, 적지 않으면 시작할 때 WARN이 나옵니다.
    open-in-view: true
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        format_sql: true

jwt:
  # HS256 서명 키입니다. 32바이트(영문 32자) 이상이어야 합니다. 배포할 때는 환경 변수 JWT_SECRET으로 바꿉니다.
  secret: ${JWT_SECRET:footprint-demo-dev-secret-key-change-me-0000}
  # token 유효 시간(분)입니다. 1440분은 24시간입니다.
  expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}

google:
  # 구글 로그인의 OAuth Client ID입니다. 비밀값이 아닙니다(화면 파일에도 들어갑니다). frontend/.env의 VITE_GOOGLE_CLIENT_ID와 같아야 합니다.
  client-id: ${GOOGLE_CLIENT_ID:729696424693-ktasf5hijpb7v53ga17j1469e8batb8f.apps.googleusercontent.com}
  # 로그인을 허용할 학교 Google Workspace 도메인(ID token의 hd)입니다. 여러 개면 쉼표로 구분합니다.
  allowed-domains: ${GOOGLE_ALLOWED_DOMAINS:g.yju.ac.kr}
  # 처음 구글 로그인할 때 교수로 저장할 이메일 목록입니다. 쉼표로 구분합니다.
  # 실제 사람의 이메일이라 저장소에 적지 않고 infra/.env 또는 환경 변수 PROFESSOR_EMAILS로 넣습니다. 비어 있으면 모두 학생입니다.
  professor-emails: ${PROFESSOR_EMAILS:}

storage:
  # MinIO(S3 호환 저장소) 접속값입니다. 기본값은 infra/.env.example과 같습니다.
  endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ROOT_USER:footprint}
  secret-key: ${MINIO_ROOT_PASSWORD:change-me-please}
  # 산출물 파일 본문을 넣는 버킷 이름입니다. 서버가 시작할 때 없으면 만듭니다.
  bucket: ${STORAGE_BUCKET:footprint}

server:
  tomcat:
    # 20MB를 넘는 업로드도 남은 body를 읽어 버린 뒤 400 응답을 보냅니다. 기본값(2MB)이면 Tomcat이 읽기를 멈추고 연결을 끊어서,
    # 브라우저가 400 대신 "연결이 끊어짐" 오류를 볼 수 있습니다. 100MB 상한은 둬서 아주 큰 요청은 계속 끊습니다.
    max-swallow-size: 100MB
