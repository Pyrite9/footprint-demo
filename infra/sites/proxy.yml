# branch 사이트 두 개(main, dev) 앞에 서는 https proxy의 compose 파일입니다(배포-3).
# 브라우저가 연 주소(main.footprint.localhost, dev.footprint.localhost)를 보고 그 사이트의 화면 컨테이너로 넘깁니다(proxy/nginx.conf).
# 직접 켜지 않고 start 스크립트로 켭니다. 두 사이트(site.yml)를 먼저 켠 뒤에 켜야 합니다(아래 networks).
name: footprint-sites-proxy

services:
  proxy:
    # 화면 이미지의 base, 실행 묶음의 proxy와 같은 nginx 이미지입니다. 설정만 이 폴더의 파일로 바꿉니다.
    image: nginx:1.28-alpine
    container_name: footprint-sites-proxy
    # 이 폴더의 파일을 컨테이너 안에 붙입니다(bind mount). :ro는 읽기 전용입니다. 컨테이너가 이 폴더의 파일을 바꾸지 못합니다.
    # certs 폴더의 인증서는 start 스크립트가 이 PC에서 처음 켤 때 만듭니다. 저장소에는 올리지 않습니다(.gitignore).
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    # 이 컴퓨터(127.0.0.1)에서만 열립니다. 80은 https 주소로 보내기만 합니다(proxy/nginx.conf).
    # 실행 묶음의 proxy와 같은 포트라서, 둘을 동시에 켜지 못합니다.
    ports:
      - "127.0.0.1:443:443"
      - "127.0.0.1:80:80"
    # 두 사이트의 기본 network에 모두 붙습니다. 그래야 footprint-main-frontend, footprint-dev-frontend라는 이름으로 두 화면 컨테이너를 찾습니다.
    networks:
      - main-site
      - dev-site

# external: true는 "이 파일이 network를 만들지 않고, 이미 있는 network를 쓴다"는 뜻입니다.
# 이 두 network는 사이트를 켤 때 compose가 만듭니다(project 이름 + _default). 그래서 두 사이트를 먼저 켜야 이 proxy가 켜집니다.
# 이 파일로 down 해도 두 network는 지우지 않습니다.
networks:
  main-site:
    external: true
    name: footprint-main_default
  dev-site:
    external: true
    name: footprint-dev_default
