# branch 사이트(main, dev)의 reverse proxy(nginx) 설정입니다. 브라우저와 https로 통신하고, 연 주소에 따라 그 사이트의 화면 컨테이너에 http로 넘깁니다.
# infra/sites/proxy.yml이 이 파일을 proxy 컨테이너의 /etc/nginx/conf.d/default.conf 자리에 읽기 전용으로 붙입니다.
# 요청이 지나는 길: 브라우저 → 이 proxy(https를 여기서 풂, 주소의 hostname으로 사이트를 고름)
#   → 그 사이트의 화면 컨테이너 nginx(/api는 같은 사이트의 backend로 넘김, frontend/nginx.conf) → 그 사이트의 backend → 그 사이트의 postgres·minio
# 인증서(certs/footprint.pem, certs/footprint-key.pem)는 start 스크립트가 이 PC에서 mkcert로 만듭니다.
#
# nginx는 켜질 때 footprint-main-frontend 같은 컨테이너 이름의 주소(IP)를 한 번만 찾고 기억합니다.
# 사이트를 다시 만들면 화면 컨테이너의 주소가 바뀌므로 proxy도 다시 켜야 합니다. start 스크립트가 매번 proxy를 새로 만듭니다.
# 켜질 때 그 이름을 찾지 못하면(사이트가 꺼져 있으면) nginx는 "host not found in upstream"으로 켜지지 않습니다.

# http(80)로 온 요청을 같은 주소의 https로 보냅니다.
server {
    listen 80;
    server_name main.footprint.localhost dev.footprint.localhost;

    # 302(임시 이동)를 씁니다. 301(영구 이동)은 브라우저가 기억해서, 사이트를 끈 뒤에도 이 주소의 http가 https로 바뀝니다.
    # $host는 브라우저가 연 주소의 hostname입니다. main으로 왔으면 https://main...으로, dev로 왔으면 https://dev...로 보냅니다.
    return 302 https://$host$request_uri;
}

# https://main.footprint.localhost로 온 요청을 main 사이트로 넘깁니다.
server {
    listen 443 ssl;
    server_name main.footprint.localhost;

    # 컨테이너 안의 경로입니다. infra/sites/certs 폴더가 /etc/nginx/certs에 붙습니다(proxy.yml).
    ssl_certificate /etc/nginx/certs/footprint.pem;
    ssl_certificate_key /etc/nginx/certs/footprint-key.pem;

    # HSTS header(Strict-Transport-Security)는 넣지 않습니다. 넣으면 브라우저가 이 주소를 https로만 기억해서, 사이트를 끈 뒤 다른 용도로 쓰기 어렵습니다.

    # 업로드 크기의 검사는 화면 컨테이너의 nginx 한 곳에서 합니다(20MB를 넘으면 400 INVALID_INPUT JSON, frontend/nginx.conf).
    # 0은 상한을 두지 않는다는 뜻입니다. 여기에 상한을 두면 그보다 큰 업로드에 이 proxy가 413 HTML을 먼저 돌려줘서, 화면이 오류 문장을 읽지 못합니다.
    client_max_body_size 0;
    # 요청 body를 이 proxy에 모두 받아 둔 뒤 넘기지 않고, 받는 대로 화면 컨테이너로 넘깁니다. 상한이 없어서 큰 파일을 디스크에 쌓지 않으려는 것입니다.
    proxy_request_buffering off;

    # 어느 사이트가 답했는지 응답 header로 알립니다. 브라우저 개발자 도구(Network)나 curl -I로 확인하는 용도입니다.
    # always: 오류 응답(404, 502 등)에도 붙입니다.
    add_header X-Footprint-Site main always;

    location / {
        # footprint-main-frontend는 main 사이트 화면 컨테이너의 이름입니다(site.yml의 container_name). main 사이트의 network로 부릅니다.
        proxy_pass http://footprint-main-frontend:80;
        # 브라우저가 보낸 Host(main.footprint.localhost)를 그대로 넘깁니다. 화면 컨테이너의 nginx도 이 값을 백엔드로 넘깁니다(frontend/nginx.conf).
        proxy_set_header Host $http_host;
    }
}

# https://dev.footprint.localhost로 온 요청을 dev 사이트로 넘깁니다. 위 main 블록과 이름만 다릅니다.
server {
    listen 443 ssl;
    server_name dev.footprint.localhost;

    ssl_certificate /etc/nginx/certs/footprint.pem;
    ssl_certificate_key /etc/nginx/certs/footprint-key.pem;

    client_max_body_size 0;
    proxy_request_buffering off;

    add_header X-Footprint-Site dev always;

    location / {
        proxy_pass http://footprint-dev-frontend:80;
        proxy_set_header Host $http_host;
    }
}

# 위 두 이름이 아닌 주소(예: https://localhost, https://127.0.0.1)로 온 요청은 어느 사이트로도 보내지 않고 404로 답합니다.
# nginx는 맞는 server_name이 없으면 그 포트의 default_server 블록으로 보냅니다. 이 블록이 없으면 첫 번째 443 블록(main)이 받습니다.
server {
    listen 443 ssl default_server;
    # _는 어느 주소와도 맞지 않는 이름입니다. 이 블록은 default_server로만 쓰입니다.
    server_name _;

    # https 연결을 맺어야 404를 보낼 수 있어서 인증서가 필요합니다. 인증서에 없는 이름이라 브라우저는 경고 화면을 먼저 보여 줍니다.
    ssl_certificate /etc/nginx/certs/footprint.pem;
    ssl_certificate_key /etc/nginx/certs/footprint-key.pem;

    return 404;
}
