# 실행 묶음의 reverse proxy(nginx) 설정입니다. 브라우저와 https로 통신하고, 받은 요청을 화면 컨테이너(frontend)에 http로 넘깁니다.
# 묶음의 docker-compose.yml이 이 파일을 proxy 컨테이너의 /etc/nginx/conf.d/default.conf 자리에 읽기 전용으로 붙입니다.
# 요청이 지나는 길: 브라우저 → 이 proxy(https를 여기서 풂) → 화면 컨테이너의 nginx(/api는 backend로 넘김, frontend/nginx.conf) → backend
# 인증서(certs/footprint.pem, certs/footprint-key.pem)는 start 스크립트가 받는 PC에서 mkcert로 만듭니다.

# http://localhost(80)로 온 요청을 https 주소로 보냅니다.
server {
    listen 80;
    server_name localhost;

    # 302(임시 이동)를 씁니다. 301(영구 이동)은 브라우저가 기억해서, 묶음을 끈 뒤에도 이 PC의 다른 http://localhost 프로그램이 https로 바뀝니다.
    # 주소를 localhost로 고정합니다. http://127.0.0.1로 열어도 로그인이 되는 https://localhost로 갑니다.
    return 302 https://localhost$request_uri;
}

# https://localhost(443)로 온 요청을 받습니다.
server {
    listen 443 ssl;
    server_name localhost;

    # 컨테이너 안의 경로입니다. 묶음 폴더의 certs 폴더가 /etc/nginx/certs에 붙습니다(docker-compose.yml).
    ssl_certificate /etc/nginx/certs/footprint.pem;
    ssl_certificate_key /etc/nginx/certs/footprint-key.pem;

    # HSTS header(Strict-Transport-Security)는 넣지 않습니다. 넣으면 브라우저가 localhost를 https로만 열어서, 개발 서버 http://localhost:5173도 열리지 않게 됩니다.

    # 업로드 크기의 검사는 화면 컨테이너의 nginx 한 곳에서 합니다(20MB를 넘으면 400 INVALID_INPUT JSON, frontend/nginx.conf).
    # 0은 상한을 두지 않는다는 뜻입니다. 여기에 상한을 두면 그보다 큰 업로드에 이 proxy가 413 HTML을 먼저 돌려줘서, 화면이 오류 문장을 읽지 못합니다.
    client_max_body_size 0;
    # 요청 body를 이 proxy에 모두 받아 둔 뒤 넘기지 않고, 받는 대로 화면 컨테이너로 넘깁니다. 상한이 없어서 큰 파일을 디스크에 쌓지 않으려는 것입니다.
    proxy_request_buffering off;

    location / {
        # frontend는 docker-compose.yml의 화면 서비스 이름입니다. compose 안의 네트워크로 부릅니다.
        proxy_pass http://frontend:80;
        # 브라우저가 보낸 Host(localhost)를 그대로 넘깁니다. 화면 컨테이너의 nginx도 이 값을 백엔드로 넘깁니다(frontend/nginx.conf).
        proxy_set_header Host $http_host;
    }
}
