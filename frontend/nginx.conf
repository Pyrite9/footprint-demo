# 화면 컨테이너의 nginx 설정입니다. 빌드한 화면 파일(dist)을 내려줍니다.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # /teams/1 같은 주소는 실제 파일이 아니라 React Router가 그리는 화면입니다.
    # 그런 파일이 없으면 index.html을 돌려줘서, 새로고침하거나 주소를 직접 입력해도 404가 나지 않게 합니다.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
