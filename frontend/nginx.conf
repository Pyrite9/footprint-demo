# 화면 컨테이너의 nginx 설정입니다. 빌드한 화면 파일(dist)을 내려주고, /api로 온 요청은 백엔드로 넘깁니다.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # 화면은 백엔드를 화면과 같은 주소의 /api로 부릅니다(빌드할 때 VITE_API_URL=/api). 같은 주소라야 브라우저가 로그인 cookie를 보냅니다.
    # proxy_pass 주소 끝의 /가 앞의 /api/를 뗍니다. 예: /api/auth/login → http://backend:8080/auth/login
    # backend는 docker-compose.yml의 서비스 이름입니다. 저장소 맨 위 compose와 실행 묶음 compose 모두 같은 이름입니다.
    location /api/ {
        proxy_pass http://backend:8080/;
        # 브라우저가 보낸 Host(예: localhost:5173)를 그대로 넘깁니다. 백엔드가 이 요청을 화면과 같은 주소의 요청으로 봅니다.
        # 넘기지 않으면 Host가 backend:8080이 되어, 백엔드가 다른 주소에서 온 요청(CORS)으로 검사합니다. 개발 서버(Vite)도 Host를 그대로 넘깁니다.
        proxy_set_header Host $http_host;
        # 요청 body의 상한입니다. nginx의 기본값은 1MB라서 그대로 두면 산출물 업로드가 막힙니다.
        # 백엔드의 상한(application.yml의 spring.servlet.multipart.max-request-size)과 같은 20MB로 둡니다(nginx의 m과 Spring의 MB는 모두 1024×1024바이트).
        # 상한을 백엔드보다 크게 두면, 20MB를 넘는 업로드에 백엔드가 파일을 다 받기 전에 400으로 답하고 남은 body를 읽지 않아서
        # nginx가 남은 body를 보내려고 60초(proxy_send_timeout)를 기다린 뒤에야 답합니다. 그래서 넘는 요청은 nginx가 백엔드로 넘기지 않습니다.
        client_max_body_size 20m;
        # 상한을 넘으면 nginx는 413 HTML을 돌려줍니다. 화면이 읽을 수 있게 백엔드와 같은 400 INVALID_INPUT JSON으로 바꿉니다.
        # 문장은 백엔드의 GlobalExceptionHandler.handleMultipart와 같습니다. 그쪽을 바꾸면 여기도 바꿉니다.
        error_page 413 = @upload_too_large;
    }

    # 위 error_page가 부르는 이름 붙은 location입니다. 주소로는 부를 수 없습니다.
    location @upload_too_large {
        default_type application/json;
        return 400 '{"code":"INVALID_INPUT","message":"파일은 20MB까지 올릴 수 있습니다"}';
    }

    # /teams/1 같은 주소는 실제 파일이 아니라 React Router가 그리는 화면입니다.
    # 그런 파일이 없으면 index.html을 돌려줘서, 새로고침하거나 주소를 직접 입력해도 404가 나지 않게 합니다.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
